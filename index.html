<style>
  :root{
    --navy: #0a2540;
    --navy-2: #123a5e;
    --navy-light: #64b5f6;
    --line: rgba(255, 255, 255, 0.2);
    --text-white: #ffffff;
    --text-light: #f0f6fc;
    --display: 'Manrope', sans-serif;
    --sans: 'Inter', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  
  html, body {
    background-color: #0f2027 !important;
    min-height: 100vh;
    width: 100%;
    margin: 0;
    padding: 0;
  }

  html{scroll-behavior:smooth;}

  body{
    color: var(--text-white);
    font-family: var(--sans);
    line-height: 1.65;
    position: relative;
  }

  /* Fixed Background Canvas for Network Animation */
  #bgCanvas {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
  }

  a{color: var(--navy-light); text-decoration:none;}
  a:hover{text-decoration:underline;}
  ::selection{background:var(--navy); color:#fff;}

  .layout{
    display:flex; 
    min-height:100vh;
    position: relative;
    z-index: 1;
  }

  /* Mobile Burger Button */
  .mobile-burger {
    display: none;
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1100;
    background: rgba(10, 37, 64, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  /* Sidebar */
  nav.sidebar{
    width:240px; flex-shrink:0;
    background: rgba(10, 37, 64, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    padding:40px 0 36px 0;
    position:fixed; top:0; left:0; height:100vh;
    overflow-y:auto;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    z-index: 1000;
    transition: transform 0.3s ease;
    
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  nav.sidebar::-webkit-scrollbar {
    display: none;
  }

  .sidebar .brand{
    font-family:var(--display); font-weight:800; font-size:17px; color:#ffffff;
    padding:0 26px 26px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:18px;
  }
  .sidebar .brand small{display:block; font-weight:500; font-size:11.5px; color:#64b5f6; margin-top:4px; letter-spacing:.04em;}
  .sidebar ul{list-style:none;}
  .sidebar li a{
    display:block; font-size:14px; font-weight:500;
    color:#ffffff; padding:11px 26px; border-left:3px solid transparent;
    transition:all .2s ease;
  }
  .sidebar li a:hover, .sidebar li a.active{
    color:#ffffff; 
    background: rgba(255, 255, 255, 0.15);
    border-left-color: #64b5f6;
    text-decoration:none;
  }
  .sidebar .linkedin{
    margin:26px 26px 0; padding-top:18px; border-top:1px solid rgba(255,255,255,0.12);
  }
  .sidebar .linkedin a{color:#64b5f6; font-size:13px; font-weight:600;}
  .sidebar .linkedin a:hover{color:#ffffff;}

  /* Main */
  main{
    flex:1; 
    min-width:0; 
    padding-bottom: 60px;
    margin-left: 240px;
  }
  
  section{
    padding:84px 64px;
    border-bottom:1px solid rgba(255, 255, 255, 0.12);
    max-width:960px;
  }

  .eyebrow{
    font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
    color:#64b5f6; margin-bottom:14px;
  }
  h1,h2,h3{font-family:var(--display); font-weight:800; color:#ffffff !important; letter-spacing:-0.01em;}
  h2{font-size:32px; margin-bottom:8px;}
  .section-sub{color:#cbd5e1 !important; margin-bottom:38px; font-size:15.5px;}

  /* HERO */
  #accueil{
    min-height:92vh; display:flex; flex-direction:column; justify-content:center;
    max-width:1100px;
  }
  .hero-flex{
    display:flex; align-items:center; justify-content:space-between; gap:48px;
  }
  .hero-text{flex:1; min-width:0;}
  .hero-photo{
    width:260px; height:260px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 12px 35px rgba(0,0,0,0.5);
  }

  .hero-kicker{
    font-size:14px; font-weight:700; color:#9be7ff !important; margin-bottom:14px; letter-spacing:.03em;
  }
  .hero-title{
    font-size:52px; color:#ffffff !important; line-height:1.12;
  }
  .hero-role{
    font-size:17px; color:#e2e8f0 !important; margin-top:16px; max-width:560px; font-weight:400;
  }
  .hero-actions{display:flex; gap:14px; margin-top:30px; flex-wrap:wrap;}

  /* Buttons */
  .btn{
    font-family:var(--sans); font-weight:600; font-size:14px; padding:12px 24px; border-radius:8px;
    transition: all 0.3s ease;
    display: inline-block;
  }
  .btn-primary{
    background: #64b5f6; 
    color:#0a2540 !important;
    border: 1px solid #64b5f6;
    box-shadow: 0 4px 15px rgba(100, 181, 246, 0.3);
    font-weight:700;
  }
  .btn-primary:hover{
    background:#9be7ff; 
    border-color:#9be7ff;
    text-decoration:none;
    transform: translateY(-2px);
  }
  .btn-ghost{
    color:#ffffff !important; 
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    font-weight:600;
  }
  .btn-ghost:hover{
    background: rgba(255, 255, 255, 0.18); 
    text-decoration:none;
    transform: translateY(-2px);
  }

  /* Cards - Dynamic Dark Liquid Glass */
  .card{
    background: rgba(15, 32, 39, 0.55);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-top: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 18px;
    padding:28px 30px; margin-bottom:20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(100, 181, 246, 0.4);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .card h3{font-size:18px; margin-bottom:6px; color:#ffffff !important;}
  .card .meta{font-size:12.5px; font-weight:600; color:#94a3b8; margin-bottom:14px; display:block;}
  .card p{color:#cbd5e1; font-size:14.5px; margin-bottom:8px;}
  .card p strong{color:#ffffff; font-weight:700;}
  .card ul{margin:10px 0 0 18px; color:#cbd5e1; font-size:14.5px;}
  .card ul li{margin-bottom:5px;}

  /* Image de projet */
  .project-img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    object-position: top;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}

  .skill-block h4{font-family:var(--display); color:#ffffff !important; font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; margin-top:22px;}
  .skill-block h4:first-child{margin-top:0;}
  .pill-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .pill{
    font-size:13px; font-weight:600; 
    background: rgba(255, 255, 255, 0.08); 
    color:#e2e8f0 !important; 
    border:1px solid rgba(255, 255, 255, 0.2); 
    padding:7px 14px; border-radius:20px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .timeline{border-left:2px solid rgba(100, 181, 246, 0.4); padding-left:26px; margin-left:6px;}
  .timeline .card{position:relative;}
  .timeline .card::before{
    content:""; position:absolute; left:-33px; top:30px; width:10px; height:10px;
    border-radius:50%; background:#64b5f6; box-shadow:0 0 0 4px rgba(15, 32, 39, 0.8);
  }

  .note{
    border-left:4px solid #64b5f6; 
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding:14px 18px; border-radius:0 10px 10px 0; font-size:13.5px; color:#cbd5e1;
    margin-top:18px;
  }
  .note strong{color:#ffffff;}

  footer{
    padding:34px 64px; font-size:13px; color:#94a3b8;
    display:flex; justify-between:space-between; flex-wrap:wrap; gap:10px;
    border-top:1px solid rgba(255, 255, 255, 0.12);
    max-width:960px;
  }
  footer a{color:#64b5f6; font-weight:600;}

  /* STYLE ACCORDÉON POUR LES RÉALISATIONS UNIQUEMENT */
  details.realisations-accordion summary {
    cursor: default;
    list-style: none;
  }
  details.realisations-accordion summary::-webkit-details-marker {
    display: none;
  }
  .chevron {
    display: none;
  }

  /* --- ADAPTATION MOBILE --- */
  @media (max-width: 900px) {
    .mobile-burger {
      display: block;
    }

    nav.sidebar {
      transform: translateX(-100%);
      width: 260px;
    }

    nav.sidebar.open {
      transform: translateX(0);
    }

    main {
      margin-left: 0;
      width: 100%;
    }

    section {
      padding: 60px 20px 30px 20px;
    }

    .hero-flex {
      flex-direction: column-reverse;
      text-align: center;
      gap: 24px;
    }

    .hero-photo {
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }

    .hero-title {
      font-size: 34px;
    }

    .hero-actions {
      justify-content: center;
    }

    .grid-2 {
      grid-template-columns: 1fr;
    }

    footer {
      padding: 24px 20px;
      flex-direction: column;
      text-align: center;
    }

    /* Accordéon Mobile uniquement pour la section Réalisations */
    details.realisations-accordion summary {
      cursor: pointer;
      position: relative;
      padding-right: 30px;
      user-select: none;
    }

    .chevron {
      display: inline-block;
    }

    details.realisations-accordion summary .chevron::after {
      content: "❯";
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #64b5f6;
      transition: transform 0.3s ease;
    }

    details.realisations-accordion[open] summary .chevron::after {
      transform: translateY(-50%) rotate(90deg);
    }

    .card-content {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  }
</style>
